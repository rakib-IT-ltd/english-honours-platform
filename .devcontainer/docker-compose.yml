# Dev container stack for VS Code (Dev Containers) and GitHub Codespaces.
# The database is only reachable from inside this compose network (and via forwarded ports), and
# uses trust authentication, so no password is stored in the repository. Development only.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/english-honours-platform:cached
    environment:
      DATABASE_URL: postgresql://ehp@db:5432/ehp_dev?schema=public
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ehp
      POSTGRES_DB: ehp_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ehp-devcontainer-pgdata:/var/lib/postgresql/data

volumes:
  ehp-devcontainer-pgdata:
